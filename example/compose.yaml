services:
  db:
    image: docker.io/postgis/postgis:latest
    container_name: qpc-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  loader:
    image: ghcr.io/osgeo/gdal:alpine-small-latest
    container_name: qpc-loader
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data.gpkg:/data.gpkg:z
    command: >
      ogr2ogr
      -f "PostgreSQL"
      PG:"host=db user=postgres dbname=postgres password=postgres"
      /data.gpkg
      -overwrite

volumes:
  postgis_data:
